# Process loyalty bonuses by calling the deployed app's cron endpoint.
# Requires repository secrets:
#   APP_URL     — public base URL of the deployed app
#   CRON_SECRET — same value as CRON_SECRET on the deployment
name: Cron — loyalty bonuses

on:
  schedule:
    # Daily at 03:00 UTC ≈ 06:00 Africa/Nairobi
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  process-loyalty:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call loyalty cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Missing repository secret APP_URL"
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing repository secret CRON_SECRET"
            exit 1
          fi

          BASE_URL="${APP_URL%/}"
          URL="${BASE_URL}/api/cron/loyalty"

          echo "POST ${URL}"
          HTTP_CODE=$(curl -sS -o /tmp/cron-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${URL}" || true)

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/cron-response.json || true
          echo
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Loyalty cron failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
