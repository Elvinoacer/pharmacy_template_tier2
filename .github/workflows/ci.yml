name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aether_ci?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/aether_ci?sslmode=disable
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ci-only-actions-key-ci-only-actions-key
      INTEGRATION_SECRET: ci-only-integration-secret-32-characters-minimum
      HEALTH_MEDIA_SIGNING_SECRET: ci-only-health-media-signing-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      AI_CLINICAL_CONTEXT_ENABLED: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aether_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aether_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to disposable database
        run: npm run release:migrate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
